name: Arsan Backtest Lab - Horizon Diagnostic (فقط دستی، تشخیصی)
on:
  workflow_dispatch:

jobs:
  horizon-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run horizon diagnostic (کاملاً جدا از analyze.yml و backtest_lab.yml)
        run: python analyzer/backtest_horizon_lab.py

      - name: Commit and push horizon results only
        run: |
          git config --global user.name "arsan-bot"
          git config --global user.email "arsan-bot@users.noreply.github.com"
          git add data/backtest_horizon_summary.json
          git diff --staged --quiet || git commit -m "نتیجه‌ی جدید تست تشخیصی افق - $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
