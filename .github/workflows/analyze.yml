name: Arsan Market Analysis
on:
  # هر ۳۰ دقیقه، فقط بین ساعت ۸ صبح تا ۱۲ شب به وقت ایران (UTC+3:30)
  # ۰۸:۰۰ ایران = ۰۴:۳۰ UTC   |   ۲۴:۰۰ ایران = ۲۰:۳۰ UTC
  schedule:
    - cron: "30 4 * * *"        # ساعت ۰۸:۰۰ ایران
    - cron: "0,30 5-20 * * *"   # از ۰۸:۳۰ تا ۲۴:۰۰ ایران، هر ۳۰ دقیقه
  # اجرای دستی از تب Actions
  workflow_dispatch:
  # trigger خارجی از سرویس cron-job.org (پایدارتر از cron داخلی گیت‌هاب)
  # نوع رویداد باید دقیقا "external-trigger" باشد
  repository_dispatch:
    types: [external-trigger]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-finbert-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python analyzer/main.py

      - name: Commit and push updated data files
        run: |
          git config --global user.name "arsan-bot"
          git config --global user.email "arsan-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "به‌روزرسانی خودکار تحلیل - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push
