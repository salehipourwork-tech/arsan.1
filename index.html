<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آرسان | بازار را با ابزار دقیق بخوان</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  /* =========================================================
     صفحه‌ی ورودی سینمایی آرسان
     همون زبان بصری داشبورد («پنل ابزار دقیق بازار») رو ادامه می‌ده تا حس
     یک محصول واحد باشه، نه یه لندینگ جدا با ظاهر متفاوت:
       - پس‌زمینه‌ی موج نوسان‌گر روی canvas (جایگزین ویدیو — چون خودِ
         شاخص‌های آرسان ذاتاً موج‌ان: RSI/MACD/بولینگر)
       - برنجی (--brass) و سبز فسفری (--buy) دقیقاً همون رنگ‌های داشبورد
       - وردمارک غول‌پیکر «آرسان» با ورود حرف‌به‌حرف از سمت راست (چون
         فارسی راست‌به‌چپه، نه چپ‌به‌راست مثل مرجع انگلیسی)
       - کرسر سفارشی فقط روی دسکتاپ با ماوس واقعی (pointer:fine) فعال می‌شه
     ========================================================= */
  :root{
    --case: #0a0e13; --panel: #121920; --screen: #0a131b;
    --grid: #223040; --brass: #d1ac3c; --brass-dim: #8a7220;
    --brass-glow: rgba(209,172,60,0.35);
    --ink: #e7edf3; --ink-dim: #8b98a6; --ink-faint: #526071;
    --buy: #33d68d; --buy-glow: rgba(51,214,141,0.5);
    --font-display: 'Noto Naskh Arabic', serif;
    --font-body: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:var(--case); color:var(--ink); font-family:var(--font-body);
    overflow:hidden; position:relative; min-height:100vh;
  }
  ::selection{ background:var(--brass); color:#1a1305; }
  a{ color:inherit; text-decoration:none; }

  /* ---------------- لایه‌ی گرادیانت بالا (محو کردن موج به سمت مشکی) ---------------- */
  #top-gradient{
    position:fixed; top:0; left:0; width:100%; height:62vh; z-index:0; pointer-events:none;
    background:linear-gradient(to bottom, var(--case) 0%, var(--case) 18%, rgba(10,14,19,0.82) 42%, rgba(10,14,19,0) 100%);
  }

  /* ---------------- پس‌زمینه‌ی موج نوسان‌گر (جایگزین ویدیو) ---------------- */
  .bg-canvas-wrap{
    position:fixed; bottom:0; left:0; width:100vw; height:88vh; z-index:-1; overflow:hidden;
  }
  #bg-canvas{ width:100%; height:100%; display:block; }
  .bg-canvas-wrap::after{
    content:''; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 56px);
  }

  /* ---------------- محتوای اصلی (هدلاین + دکمه) ---------------- */
  main.hero-content{
    position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;
    text-align:center; padding-top:9vh; width:92%; max-width:900px; margin:0 auto;
  }
  .hero-title{
    font-family:var(--font-display); font-weight:700; color:var(--ink);
    font-size:clamp(1.9rem, 5vw, 3.2rem); line-height:1.35; margin-bottom:2.4rem;
    text-shadow:0 4px 30px rgba(0,0,0,0.6);
  }
  .hero-title .accent{ color:var(--brass); }

  .hero-btn{
    font-family:var(--font-body); font-size:1.05rem; font-weight:600; color:var(--ink);
    background:var(--panel); border:1px solid rgba(255,255,255,0.14);
    padding:1.05rem 2.2rem; border-radius:9999px; display:inline-flex; align-items:center; gap:0.9rem;
    cursor:pointer; transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
    box-shadow:0 4px 25px rgba(0,0,0,0.5); outline:none;
  }
  .hero-btn:hover{
    background:var(--ink); color:#0a0e13; border-color:var(--ink);
    transform:translateY(-2px); box-shadow:0 6px 30px rgba(0,0,0,0.4);
  }
  .hero-btn:active{ transform:translateY(0); }

  .blinking-dot{
    width:9px; height:9px; background:var(--buy); border-radius:50%; position:relative;
    display:inline-block; animation:pulse-glow 2s infinite ease-in-out; flex:none;
  }
  .blinking-dot::after{
    content:''; position:absolute; top:-5px; left:-5px; right:-5px; bottom:-5px;
    background:var(--buy-glow); border-radius:50%; animation:wave-expand 2s infinite ease-in-out;
  }
  @keyframes pulse-glow{
    0%,100%{ opacity:0.55; transform:scale(0.85); box-shadow:0 0 4px rgba(51,214,141,0.35); }
    50%{ opacity:1; transform:scale(1.1); box-shadow:0 0 12px rgba(51,214,141,0.9); }
  }
  @keyframes wave-expand{ 0%{ transform:scale(0.6); opacity:0.85; } 100%{ transform:scale(2.2); opacity:0; } }

  .hero-sub{
    margin-top:1.4rem; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
    letter-spacing:0.3px;
  }

  /* ---------------- فوتر (تراز عمودی وسط صفحه) ---------------- */
  footer.footer-container{
    position:fixed; top:50vh; left:20px; right:20px; width:calc(100vw - 40px);
    transform:translateY(-50%); z-index:3; display:flex; flex-direction:column;
  }
  .footer-top{ display:flex; justify-content:space-between; align-items:flex-end; width:100%; padding:0 4px; gap:12px; }
  .footer-title{ font-family:var(--font-body); font-weight:600; font-size:1.2rem; color:var(--ink); margin:0; }
  .footer-title.quote{ color:var(--ink-dim); font-weight:400; font-size:1rem; }
  .footer-divider{ border:none; height:1px; background:var(--grid); margin:1.5rem 0; width:100%; }
  .footer-bottom{ display:flex; justify-content:space-between; align-items:center; width:100%; padding:0 4px; gap:12px; flex-wrap:wrap; }
  .footer-links{ display:flex; gap:2rem; flex:2; flex-wrap:wrap; }
  .footer-link{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-dim); transition:color 0.25s, transform 0.25s; }
  .footer-link:hover{ color:var(--brass); transform:translateY(-1px); }
  .footer-copyright{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); flex:1; text-align:left; }
  .footer-status{ display:flex; align-items:center; gap:7px; flex:1; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .footer-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--buy); box-shadow:0 0 6px 1px var(--buy-glow); }

  /* ---------------- وردمارک غول‌پیکر «آرسان» ---------------- */
  .wordmark-wrap{
    position:fixed; bottom:14px; left:0; right:0; width:100%; padding:0 16px; box-sizing:border-box;
    display:flex; justify-content:center; align-items:center; z-index:3; margin:0; direction:rtl;
  }
  .wordmark-text{
    font-family:var(--font-display); font-weight:700; color:var(--ink);
    font-size:clamp(90px, 30vw, 340px); letter-spacing:-0.01em; line-height:0.8;
    text-align:center; width:100%; pointer-events:none; opacity:0.96; white-space:nowrap;
  }
  .wordmark-text .letter-wrapper{ display:inline-block; overflow:hidden; vertical-align:bottom; line-height:0.8; }
  .wordmark-text .letter-inner{
    display:inline-block; opacity:0; transform:translateX(105%); filter:blur(20px);
    animation:letter-reveal-mask 1.2s cubic-bezier(0.05,0.9,0.1,1) forwards;
  }
  @keyframes letter-reveal-mask{
    0%{ opacity:0; transform:translateX(105%); filter:blur(20px); }
    25%{ opacity:1; }
    100%{ opacity:0.96; transform:translateX(0); filter:blur(0); }
  }
  .hero-title .word-wrapper{ display:inline-block; overflow:hidden; vertical-align:bottom; padding-bottom:0.15em; margin-bottom:-0.15em; }
  .hero-title .word-inner{
    display:inline-block; opacity:0; transform:translateY(105%); filter:blur(20px);
    animation:word-reveal-mask 1.3s cubic-bezier(0.05,0.9,0.1,1) forwards;
  }
  @keyframes word-reveal-mask{
    0%{ opacity:0; transform:translateY(105%); filter:blur(20px); }
    30%{ opacity:1; }
    100%{ opacity:1; transform:translateY(0); filter:blur(0); }
  }

  /* ---------------- کرسر سفارشی (فقط دسکتاپ با ماوس واقعی) ---------------- */
  .cursor-ring-outline{
    position:fixed; top:0; left:0; width:46px; height:46px;
    border:1.5px solid rgba(231,237,243,0.4); border-radius:50%; z-index:99998; pointer-events:none;
    transform:translate(-50%,-50%) scale(0); opacity:0;
    transition:opacity 0.4s cubic-bezier(0.16,1,0.3,1), border-color 0.4s ease;
  }
  .cursor-ring-outline.active{ opacity:1; }
  .cursor-ring-outline.expanded{ border-color:var(--brass-glow); }
  .glass-cursor-card{
    position:fixed; top:0; left:0; z-index:99999; pointer-events:none;
    padding:0.7rem 1.4rem; background:rgba(18,25,32,0.75); backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.14); border-radius:9999px;
    box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.08); transform:translate(-50%,-50%) scale(0); opacity:0;
    transition:opacity 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .glass-cursor-card.active{ opacity:1; }
  .cursor-card-text{
    font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.05em; color:var(--brass);
    white-space:nowrap; text-shadow:0 0 8px var(--brass-glow);
  }
  .cursor-card-text .text-dim{ color:var(--ink-dim); }

  @media (hover:none), (pointer:coarse){
    .cursor-ring-outline, .glass-cursor-card{ display:none !important; }
  }
  @media (prefers-reduced-motion: reduce){
    .letter-inner, .word-inner{ animation:none !important; opacity:1 !important; transform:none !important; filter:none !important; }
  }

  /* ---------------- حالت موبایل/صفحه‌ی کوتاه: از تمام‌صفحه‌ی ثابت خارج و به حالت عادی اسکرول‌پذیر برمی‌گرده ---------------- */
  @media (max-width:700px), (max-height:600px){
    body{ overflow-y:auto; height:auto; }
    #top-gradient{ position:absolute; height:100vh; }
    .bg-canvas-wrap{ position:absolute; height:100vh; }
    main.hero-content{ position:relative; padding:8vh 0 3rem; }
    footer.footer-container{ position:relative; top:auto; transform:none; left:0; right:0; width:100%; padding:2.5rem 20px; }
    .footer-top{ flex-direction:column; align-items:flex-start; gap:6px; }
    .footer-bottom{ flex-direction:column; align-items:flex-start; gap:14px; }
    .footer-copyright{ text-align:right; }
    .wordmark-wrap{ position:relative; bottom:auto; padding:1rem 12px 3rem; }
    .wordmark-text{ font-size:clamp(64px, 22vw, 160px); }
  }
</style>
</head>
<body>

<div id="top-gradient"></div>

<main class="hero-content">
  <h1 class="hero-title">بازار را با <span class="accent">ابزار دقیق</span> بخوان، <br> نه با حدس.</h1>
  <button class="hero-btn" onclick="location.href='dashboard.html'">
    <span class="btn-text">ورود به داشبورد</span>
    <span class="blinking-dot"></span>
  </button>
  <div class="hero-sub">تحلیل زنده رمزارز — رژیم بازار، وزن‌دهی پویا، شفافیت کامل عملکرد</div>
</main>

<footer class="footer-container">
  <div class="footer-top">
    <h2 class="footer-title">با آرسان همراه شو</h2>
    <h2 class="footer-title quote">بخوان. بسنج. با اطمینان تصمیم بگیر.</h2>
  </div>
  <hr class="footer-divider">
  <div class="footer-bottom">
    <div class="footer-status"><span class="dot"></span>موتور تحلیل: فعال</div>
    <nav class="footer-links">
      <a href="dashboard.html" class="footer-link">داشبورد</a>
      <a href="dashboard.html" class="footer-link">میزکار معاملاتی</a>
      <a href="dashboard.html" class="footer-link">تنظیمات و گزارش‌ها</a>
      <a href="rsp-shadow.html" class="footer-link">موتور RSP</a>
    </nav>
    <div class="footer-copyright">© ۲۰۲۶ آرسان</div>
  </div>
</footer>

<div class="wordmark-wrap">
  <h2 class="wordmark-text">آرسان</h2>
</div>

<div class="bg-canvas-wrap"><canvas id="bg-canvas"></canvas></div>

<div id="cursor-ring" class="cursor-ring-outline"></div>
<div id="glass-card" class="glass-cursor-card">
  <span class="cursor-card-text"><span class="text-dim">برو</span> داخل!</span>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  /* ---------------- ورود حرف‌به‌حرف وردمارک غول‌پیکر (راست‌به‌چپ برای فارسی) ---------------- */
  const logoText = document.querySelector('.wordmark-text');
  if(logoText){
    const text = logoText.textContent.trim();
    logoText.innerHTML = '';
    [...text].forEach((char, index) => {
      const wrapper = document.createElement('span');
      wrapper.className = 'letter-wrapper';
      const inner = document.createElement('span');
      inner.textContent = char === ' ' ? '\u00A0' : char;
      inner.className = 'letter-inner';
      inner.style.animationDelay = `${index * 0.09}s`;
      wrapper.appendChild(inner);
      logoText.appendChild(wrapper);
    });
  }

  /* ---------------- ورود واژه‌به‌واژه‌ی هدلاین ---------------- */
  const heroTitle = document.querySelector('.hero-title');
  if(heroTitle){
    const html = heroTitle.innerHTML;
    const parts = html.split(/(\s+|<br\s*\/?>|<span class="accent">|<\/span>)/i);
    heroTitle.innerHTML = '';
    let wordIndex = 0;
    let inAccent = false;
    parts.forEach(part => {
      if(part === undefined || part === '') return;
      if(/^<br/i.test(part)){ heroTitle.appendChild(document.createElement('br')); return; }
      if(/^<span class="accent">$/i.test(part)){ inAccent = true; return; }
      if(/^<\/span>$/i.test(part)){ inAccent = false; return; }
      if(part.trim() === ''){ heroTitle.appendChild(document.createTextNode(' ')); return; }
      const wrapper = document.createElement('span');
      wrapper.className = 'word-wrapper';
      const inner = document.createElement('span');
      inner.className = 'word-inner';
      if(inAccent) inner.style.color = 'var(--brass)';
      inner.textContent = part;
      inner.style.animationDelay = `${wordIndex * 0.1}s`;
      wordIndex++;
      wrapper.appendChild(inner);
      heroTitle.appendChild(wrapper);
    });
  }

  /* ---------------- کرسر سفارشی — فقط روی دستگاه با ماوس واقعی فعال می‌شه ---------------- */
  const hasFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const glassCard = document.getElementById('glass-card');
  const cursorRing = document.getElementById('cursor-ring');

  if(hasFinePointer && glassCard && cursorRing){
    let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
    let cardX = mouseX, cardY = mouseY, ringX = mouseX, ringY = mouseY;
    let isFirstMove = true, scale = 0, targetScale = 0, isHoveringBtn = false;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX; mouseY = e.clientY;
      if(isFirstMove){
        cardX = mouseX; cardY = mouseY; ringX = mouseX; ringY = mouseY;
        isFirstMove = false;
        glassCard.classList.add('active'); cursorRing.classList.add('active');
      }
      if(!isHoveringBtn) targetScale = 1;
    });
    document.addEventListener('mouseleave', () => { targetScale = 0; });
    document.addEventListener('mouseenter', () => { if(!isHoveringBtn) targetScale = 1; });

    const heroBtn = document.querySelector('.hero-btn');
    if(heroBtn){
      heroBtn.addEventListener('mouseenter', () => {
        isHoveringBtn = true; targetScale = 0; cursorRing.classList.add('expanded');
      });
      heroBtn.addEventListener('mouseleave', () => {
        isHoveringBtn = false; targetScale = 1; cursorRing.classList.remove('expanded');
      });
    }

    const updatePhysics = () => {
      cardX += (mouseX - cardX) * 0.08;
      cardY += (mouseY - cardY) * 0.08;
      ringX = mouseX; ringY = mouseY;
      scale += (targetScale - scale) * 0.15;
      const ringScale = cursorRing.classList.contains('expanded') ? 1.6 * scale : scale;
      glassCard.style.transform = `translate3d(${cardX}px, ${cardY}px, 0) translate(-50%,-50%) scale(${scale})`;
      cursorRing.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%,-50%) scale(${ringScale})`;
      requestAnimationFrame(updatePhysics);
    };
    updatePhysics();
  }

  /* ---------------- پس‌زمینه‌ی موج نوسان‌گر روی canvas (جایگزین ویدیو) ---------------- */
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const lines = [
    { color: 'rgba(209,172,60,0.32)', ampFrac: 0.07, freq: 0.006, speed: 0.014, yFrac: 0.32, width: 2 },
    { color: 'rgba(51,214,141,0.28)', ampFrac: 0.045, freq: 0.011, speed: 0.021, yFrac: 0.52, width: 1.6 },
    { color: 'rgba(231,237,243,0.05)', ampFrac: 0.11, freq: 0.004, speed: 0.009, yFrac: 0.74, width: 1 },
  ];
  let t = 0;
  function draw(){
    const w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.clearRect(0, 0, w, h);
    lines.forEach(line => {
      ctx.beginPath();
      const amp = h * line.ampFrac, yBase = h * line.yFrac;
      for(let x = 0; x <= w; x += 5){
        const y = yBase + Math.sin(x * line.freq + t * line.speed) * amp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = line.color;
      ctx.lineWidth = line.width;
      ctx.stroke();
    });
    t++;
    if(!reduceMotion) requestAnimationFrame(draw);
  }
  draw();
});
</script>
</body>
</html>
